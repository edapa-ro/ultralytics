# my_model.yaml

nc: 80  # number of classes
depth_multiple: 0.33
width_multiple: 0.50

backbone:
  [
    [-1, 1, Conv, [16, 3, 2]],           # 0
    [-1, 1, Conv, [32, 3, 2]],          # 1
    # [-1, 1, AMAP, [32]],      #aici amap 2
    [-1, 1, Conv, [64, 3, 2]],          # 3
    [-1, 1, Conv, [128, 3, 2]],          # 4
    [-1, 1, SPP, [128]],                  # 5
  ]

head:
  [
    [-1, 1, Conv, [64, 1, 1]],                 # 6
    # [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 7
    [[-1, 3], 1, Concat, [1]],                  # 8

    [-1, 1, Conv, [64, 1, 1]],                 # 9
    [-1, 1, nn.Upsample, [None, 4, 'nearest']], # 10
    [[-1, 1], 1, Concat, [1]],                  # 11

    [[9], 1, Detect, [nc]]                      # 12 final detect layer
  ]
